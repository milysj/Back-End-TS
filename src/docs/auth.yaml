openapi: 3.0.0
info:
  title: EstudeMy API - Auth
  version: 1.0.0
paths:
  /api/auth/login:
    post:
      tags:
        - Autenticação
      summary: Login de usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, senha]
              properties:
                email:
                  type: string
                  example: aluno@email.com
                senha:
                  type: string
                  example: senhaaluno
      responses:
        '200':
          description: Login bem sucedido
        '400':
          description: Dados inválidos (ex. e-mail ou senha ausentes)
        '401':
          description: Credenciais inválidas (e-mail ou senha incorretos)
        '500':
          description: Erro interno do servidor
  /api/auth/register:
    post:
      tags:
        - Autenticação
      summary: Registro de novo usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, email, senha, dataNascimento, tipoUsuario, aceiteTermos]
              properties:
                nome:
                  type: string
                  example: João Silva
                email:
                  type: string
                  example: aluno@email.com
                senha:
                  type: string
                  example: senhaaluno
                dataNascimento:
                  type: string
                  format: date
                  example: "2005-08-15"
                tipoUsuario:
                  type: string
                  example: "ALUNO"
                aceiteTermos:
                  type: boolean
                  example: true
      responses:
        '201':
          description: Usuário registrado com sucesso
        '400':
          description: Dados inválidos (ex. e-mail mal formatado)
        '409':
          description: Conflito (e-mail já cadastrado)
        '500':
          description: Erro interno do servidor
  /api/auth/verify:
    get:
      tags:
        - Autenticação
      summary: Verificar validade do token JWT
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Autenticação válida (Token ativo)
        '401':
          description: Não autorizado (Token ausente, expirado ou inválido)
        '500':
          description: Erro interno do servidor
  /api/auth/confirmar:
    get:
      tags:
        - Autenticação
      summary: Confirmar email do usuário via token
      parameters:
        - in: query
          name: token
          schema:
            type: string
            example: "abc123tokenverificacao"
          required: true
      responses:
        '200':
          description: Email confirmado com sucesso
        '400':
          description: Token inválido ou ausente na requisição
        '500':
          description: Erro interno do servidor
  /api/auth/criarPerfil:
    post:
      tags:
        - Autenticação
      summary: Criar perfil do usuário (Upload de imagem)
      security:
        - bearerAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                fotoPerfil:
                  type: string
                  format: binary
                  description: "Imagem JPG ou PNG para o perfil"
      responses:
        '200':
          description: Perfil criado e imagem salva
        '400':
          description: Erro no upload (arquivo inválido ou ausente)
        '401':
          description: Não autorizado (Token ausente ou inválido)
        '500':
          description: Erro interno do servidor
