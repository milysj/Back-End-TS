openapi: 3.0.0
info:
  title: EstudeMy API - Fases e Seções
  version: 1.0.0
paths:
  /api/fases:
    get:
      tags:
        - Fases
      summary: Listar todas as fases
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de fases
        '401':
          description: Não autorizado
        '500':
          description: Erro interno
    post:
      tags:
        - Fases
      summary: Criar nova fase (Apenas Professores/Admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titulo, trilhaId, ordem]
              properties:
                trilhaId:
                  type: string
                  example: "60f7a9b8c9e77c0015f8a0a1"
                secaoId:
                  type: string
                  example: "60f7a9b8c9e77c0015f8a0b1"
                titulo:
                  type: string
                  example: "Fase 1: Introdução"
                descricao:
                  type: string
                  example: "Bem-vindo à primeira fase."
                conteudo:
                  type: string
                  example: "Aqui vai o conteúdo da fase em texto..."
                ordem:
                  type: integer
                  example: 1
      responses:
        '201':
          description: Fase criada
        '400':
          description: Dados inválidos
        '401':
          description: Não autorizado
        '403':
          description: Proibido (Apenas Professores podem realizar esta ação)
        '500':
          description: Erro interno
  /api/fases/trilha/{trilhaId}:
    get:
      tags:
        - Fases
      summary: Buscar fases por ID da trilha
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: trilhaId
          required: true
          schema:
            type: string
            example: "60f7a9b8c9e77c0015f8a0a1"
      responses:
        '200':
          description: Lista de fases
        '401':
          description: Não autorizado
        '404':
          description: Trilha não encontrada
        '500':
          description: Erro interno
  /api/fases/secao/{secaoId}:
    get:
      tags:
        - Fases
      summary: Buscar fases por ID da seção
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: secaoId
          required: true
          schema:
            type: string
            example: "60f7a9b8c9e77c0015f8a0b1"
      responses:
        '200':
          description: Lista de fases
        '401':
          description: Não autorizado
        '404':
          description: Seção não encontrada
        '500':
          description: Erro interno
  /api/fases/concluir:
    post:
      tags:
        - Fases
      summary: Concluir uma fase
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                faseId:
                  type: string
                  example: "60f7a9b8c9e77c0015f8a0c1"
      responses:
        '200':
          description: Fase concluída com sucesso
        '400':
          description: Dados inválidos
        '401':
          description: Não autorizado
        '404':
          description: Fase não encontrada
        '500':
          description: Erro interno
  /api/fases/{id}:
    get:
      tags:
        - Fases
      summary: Buscar fase por ID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            example: "60f7a9b8c9e77c0015f8a0c1"
      responses:
        '200':
          description: Fase encontrada
        '401':
          description: Não autorizado
        '404':
          description: Fase não encontrada
        '500':
          description: Erro interno
    put:
      tags:
        - Fases
      summary: Atualizar fase (Apenas Professores/Admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            example: "60f7a9b8c9e77c0015f8a0c1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                titulo:
                  type: string
                  example: "Fase 1: Introdução Revisada"
      responses:
        '200':
          description: Fase atualizada
        '400':
          description: Dados inválidos
        '401':
          description: Não autorizado
        '403':
          description: Proibido (Apenas Professores)
        '404':
          description: Fase não encontrada
        '500':
          description: Erro interno
    delete:
      tags:
        - Fases
      summary: Deletar fase (Apenas Professores/Admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            example: "60f7a9b8c9e77c0015f8a0c1"
      responses:
        '200':
          description: Fase deletada
        '401':
          description: Não autorizado
        '403':
          description: Proibido (Apenas Professores)
        '404':
          description: Fase não encontrada
        '500':
          description: Erro interno

  /api/secoes:
    get:
      tags:
        - Seções
      summary: Listar todas as seções
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de seções
        '401':
          description: Não autorizado
        '500':
          description: Erro interno
    post:
      tags:
        - Seções
      summary: Criar nova seção (Apenas Professores/Admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titulo, trilhaId, ordem]
              properties:
                titulo:
                  type: string
                  example: "Módulo 1: Básicos"
                descricao:
                  type: string
                  example: "Conceitos básicos e iniciais."
                trilhaId:
                  type: string
                  example: "60f7a9b8c9e77c0015f8a0a1"
                ordem:
                  type: integer
                  example: 1
      responses:
        '201':
          description: Seção criada
        '400':
          description: Dados inválidos
        '401':
          description: Não autorizado
        '403':
          description: Proibido (Apenas Professores)
        '500':
          description: Erro interno
  /api/secoes/trilha/{trilhaId}:
    get:
      tags:
        - Seções
      summary: Buscar seções por ID da trilha
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: trilhaId
          required: true
          schema:
            type: string
            example: "60f7a9b8c9e77c0015f8a0a1"
      responses:
        '200':
          description: Lista de seções
        '401':
          description: Não autorizado
        '404':
          description: Trilha não encontrada
        '500':
          description: Erro interno
  /api/secoes/{id}:
    get:
      tags:
        - Seções
      summary: Buscar seção por ID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            example: "60f7a9b8c9e77c0015f8a0b1"
      responses:
        '200':
          description: Seção encontrada
        '401':
          description: Não autorizado
        '404':
          description: Seção não encontrada
        '500':
          description: Erro interno
    put:
      tags:
        - Seções
      summary: Atualizar seção (Apenas Professores/Admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            example: "60f7a9b8c9e77c0015f8a0b1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                titulo:
                  type: string
                  example: "Módulo 1: Fundamentos"
      responses:
        '200':
          description: Seção atualizada
        '400':
          description: Dados inválidos
        '401':
          description: Não autorizado
        '403':
          description: Proibido (Apenas Professores)
        '404':
          description: Seção não encontrada
        '500':
          description: Erro interno
    delete:
      tags:
        - Seções
      summary: Deletar seção (Apenas Professores/Admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            example: "60f7a9b8c9e77c0015f8a0b1"
      responses:
        '200':
          description: Seção deletada
        '401':
          description: Não autorizado
        '403':
          description: Proibido (Apenas Professores)
        '404':
          description: Seção não encontrada
        '500':
          description: Erro interno
