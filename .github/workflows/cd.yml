name: CD (Deploy)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-hml:
    name: Deploy em HML
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '22'

      - name: Obter versão do package.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build e Push Docker (HML)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/estudemy-backend:hml
            ${{ secrets.DOCKER_USERNAME }}/estudemy-backend:hml-${{ steps.get_version.outputs.version }}

      - name: Enviar email em caso de falha
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_ORIGIN }}
          password: ${{ secrets.EMAIL_APP_PASSWORD }}  
          subject: "Falha no CD (HML) - Back-End-TS"
          body: "O processo de CD para HML falhou. Por favor, verifique os logs para mais detalhes."
          to: ${{ secrets.EMAIL_DESTINO }}
          from: ${{ secrets.EMAIL_ORIGIN }}   

  deploy-prod:
    name: Deploy em PROD
    runs-on: ubuntu-latest
    needs: deploy-hml
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '22'

      - name: Obter versão do package.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build e Push Docker (PROD)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/estudemy-backend:prod
            ${{ secrets.DOCKER_USERNAME }}/estudemy-backend:${{ steps.get_version.outputs.version }}

      - name: Enviar email em caso de falha
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_ORIGIN }}
          password: ${{ secrets.EMAIL_APP_PASSWORD }}  
          subject: "Falha no CD (PROD) - Back-End-TS"
          body: "O processo de CD para PROD falhou. Por favor, verifique os logs para mais detalhes."
          to: ${{ secrets.EMAIL_DESTINO }}
          from: ${{ secrets.EMAIL_ORIGIN }}   
